<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#1a1a1a"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="TimeClock"/>
<link rel="manifest" href="manifest.json"/>
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png"/>
<link href="https://fonts.googleapis.com/css2?family=Khand:wght@400;500;600;700&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet"/>
<title>TimeClock</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#1a1a1a;
  --bg2:#222222;
  --bg3:#2c2c2c;
  --card:#222222;
  --border:#3a3a3a;
  --primary:#CE1126;
  --green:#e85d75;
  --text:#f5f5f5;
  --subtle:#a0a0a0;
  --danger:#ff6b6b;
  --font-head:'Khand',sans-serif;
  --font-body:'Roboto',sans-serif;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--font-body);overflow:hidden}
body{display:flex;flex-direction:column}

/* ── HEADER ── */
header{
  background:var(--bg2);
  padding:calc(var(--safe-top) + 12px) 16px 12px;
  display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid var(--border);
  flex-shrink:0;
}
header h1{font-family:var(--font-head);font-size:1.6rem;font-weight:700;color:var(--primary);letter-spacing:.5px}
#clock-display{font-size:.85rem;color:var(--subtle);font-weight:300}

/* ── NAV TABS ── */
nav{
  display:flex;background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0;
}
nav button{
  flex:1;padding:10px 4px;background:none;border:none;color:var(--subtle);
  font-family:var(--font-head);font-size:1rem;font-weight:500;letter-spacing:.3px;
  cursor:pointer;position:relative;transition:color .2s;
}
nav button.active{color:var(--primary)}
nav button.active::after{
  content:'';position:absolute;bottom:0;left:10%;width:80%;height:2px;
  background:var(--primary);border-radius:2px 2px 0 0;
}

/* ── CONTENT ── */
main{flex:1;overflow-y:auto;padding:16px 16px calc(var(--safe-bottom) + 16px)}
.tab{display:none}
.tab.active{display:block}

/* ── CARDS ── */
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:12px}
.card-row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.card-label{font-size:.78rem;color:var(--subtle);text-transform:uppercase;letter-spacing:.5px;font-weight:500}
.card-value{font-family:var(--font-head);font-size:1.4rem;font-weight:600}
.card-value.big{font-size:2rem}
.card-value.green{color:#ff8fa0}
.card-value.yellow{color:var(--primary)}

/* ── CLOCK BUTTON ── */
#clock-btn{
  width:100%;padding:18px;border:none;border-radius:12px;cursor:pointer;
  font-family:var(--font-head);font-size:1.4rem;font-weight:700;letter-spacing:1px;
  transition:all .15s;margin-bottom:12px;
}
#clock-btn.clocked-out{background:var(--primary);color:#fff}
#clock-btn.clocked-in{background:var(--danger);color:#fff}
#clock-btn:active{transform:scale(.97)}

/* ── NOTE INPUT ── */
.note-row{display:flex;gap:8px;margin-bottom:12px}
.note-row input{
  flex:1;background:var(--bg3);border:1px solid var(--border);border-radius:8px;
  padding:10px 12px;color:var(--text);font-family:var(--font-body);font-size:.9rem;
}
.note-row input::placeholder{color:var(--subtle)}
.note-row input:focus{outline:none;border-color:var(--primary)}

/* ── TIMER ── */
#timer{
  text-align:center;font-family:var(--font-head);font-size:3.5rem;font-weight:700;
  color:var(--primary);letter-spacing:2px;padding:12px 0;
}
#timer.hidden{display:none}

/* ── SUMMARY GRID ── */
.summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.summary-grid .card{margin-bottom:0}

/* ── FORM CONTROLS ── */
.form-group{margin-bottom:12px}
.form-group label{display:block;font-size:.78rem;color:var(--subtle);text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px;font-weight:500}
.form-group input,.form-group textarea,.form-group select{
  width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:8px;
  padding:10px 12px;color:var(--text);font-family:var(--font-body);font-size:.9rem;
}
.form-group input:focus,.form-group textarea:focus,.form-group select:focus{outline:none;border-color:var(--primary)}
.form-group textarea{resize:vertical;min-height:60px}

/* ── BUTTONS ── */
.btn{
  padding:10px 16px;border:none;border-radius:8px;cursor:pointer;
  font-family:var(--font-head);font-size:1rem;font-weight:600;letter-spacing:.3px;transition:opacity .15s;
}
.btn:active{opacity:.8}
.btn-primary{background:var(--primary);color:#fff}
.btn-secondary{background:var(--bg3);color:var(--text);border:1px solid var(--border)}
.btn-danger{background:var(--danger);color:#fff}
.btn-green{background:var(--primary);color:#fff}
.btn-sm{padding:6px 11px;font-size:.85rem}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}

/* ── ENTRY CARD ── */
.entry-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:8px}
.entry-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px}
.entry-date{font-family:var(--font-head);font-size:1rem;font-weight:600}
.entry-actions{display:flex;gap:6px}
.entry-times{font-size:.82rem;color:var(--subtle);margin-bottom:4px}
.entry-meta{display:flex;gap:12px;font-size:.82rem}
.entry-note{font-size:.8rem;color:var(--subtle);font-style:italic;margin-top:4px;border-top:1px solid var(--border);padding-top:4px}
.badge{
  display:inline-block;padding:2px 8px;border-radius:20px;font-size:.72rem;font-weight:600;
  font-family:var(--font-head);letter-spacing:.3px;
}
.badge-green{background:rgba(206,17,38,.18);color:#ff8fa0}
.badge-yellow{background:rgba(206,17,38,.15);color:#ff8fa0}
.badge-subtle{background:var(--bg3);color:var(--subtle)}

/* ── CYCLE CARD ── */
.cycle-card{background:var(--card);border:1px solid var(--border);border-radius:10px;margin-bottom:10px;overflow:hidden}
.cycle-header{padding:12px 14px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.cycle-header:hover{background:var(--bg3)}
.cycle-name{font-family:var(--font-head);font-size:1.05rem;font-weight:600}
.cycle-range{font-size:.78rem;color:var(--subtle);margin-top:2px}
.cycle-stats{text-align:right}
.cycle-body{padding:0 14px 12px;border-top:1px solid var(--border);display:none}
.cycle-body.open{display:block}
.cycle-total-row{display:flex;justify-content:space-between;padding:10px 0 8px;font-size:.85rem}

/* ── SECTION HEADER ── */
.section-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.section-title{font-family:var(--font-head);font-size:1.2rem;font-weight:700}

/* ── SETTINGS ── */
.settings-section{margin-bottom:20px}
.settings-section-title{font-family:var(--font-head);font-size:1rem;font-weight:600;color:var(--primary);margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--border)}

/* ── MODAL ── */
.modal-overlay{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;
  align-items:flex-end;justify-content:center;
}
.modal-overlay.open{display:flex}
.modal{
  background:var(--bg2);border:1px solid var(--border);border-radius:16px 16px 0 0;
  width:100%;max-width:480px;padding:20px 20px calc(var(--safe-bottom) + 20px);
  max-height:85vh;overflow-y:auto;
}
.modal-title{font-family:var(--font-head);font-size:1.2rem;font-weight:700;margin-bottom:16px;color:var(--primary)}
.modal-actions{display:flex;gap:8px;margin-top:16px}
.modal-actions .btn{flex:1}

/* ── EMPTY STATE ── */
.empty{text-align:center;padding:40px 20px;color:var(--subtle)}
.empty-icon{font-size:2.5rem;margin-bottom:8px}
.empty p{font-size:.9rem}

/* ── TOAST ── */
#toast{
  position:fixed;bottom:calc(var(--safe-bottom) + 70px);left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--bg3);border:1px solid var(--border);color:var(--text);
  padding:10px 20px;border-radius:30px;font-size:.85rem;opacity:0;transition:all .3s;pointer-events:none;
  white-space:nowrap;z-index:200;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.success{border-color:var(--primary);color:#ff8fa0}
#toast.error{border-color:var(--danger);color:var(--danger)}

.divider{height:1px;background:var(--border);margin:12px 0}
.text-subtle{color:var(--subtle);font-size:.82rem}
.mt-8{margin-top:8px}
.w-full{width:100%}
</style>
</head>
<body>

<header>
  <h1>⏱ TimeClock</h1>
  <span id="clock-display"></span>
</header>

<nav>
  <button class="active" onclick="switchTab('clock')">Clock</button>
  <button onclick="switchTab('log')">Log</button>
  <button onclick="switchTab('cycles')">Cycles</button>
  <button onclick="switchTab('settings')">Settings</button>
</nav>

<main>

  <!-- ══ CLOCK TAB ══ -->
  <div class="tab active" id="tab-clock">
    <div id="timer" class="hidden">00:00:00</div>

    <div class="note-row">
      <input type="text" id="punch-note" placeholder="Note (optional)…" maxlength="120"/>
    </div>

    <button id="clock-btn" class="clocked-out" onclick="toggleClock()">CLOCK IN</button>

    <div class="summary-grid">
      <div class="card">
        <div class="card-label">Today</div>
        <div class="card-value yellow" id="today-hours">0.00 hrs</div>
      </div>
      <div class="card">
        <div class="card-label">Today Pay</div>
        <div class="card-value green" id="today-pay">$0.00</div>
      </div>
      <div class="card">
        <div class="card-label">Cycle Hours</div>
        <div class="card-value yellow" id="cycle-hours">—</div>
      </div>
      <div class="card">
        <div class="card-label">Cycle Pay</div>
        <div class="card-value green" id="cycle-pay">—</div>
      </div>
    </div>

    <div class="card mt-8">
      <div class="card-row">
        <div>
          <div class="card-label">Active Cycle</div>
          <div id="active-cycle-name" style="font-family:var(--font-head);font-size:1rem;font-weight:600;margin-top:2px">None</div>
        </div>
        <span id="status-badge" class="badge badge-subtle">Clocked Out</span>
      </div>
    </div>
  </div>

  <!-- ══ LOG TAB ══ -->
  <div class="tab" id="tab-log">
    <div class="section-header">
      <span class="section-title">Time Log</span>
      <div class="btn-row">
        <button class="btn btn-secondary btn-sm" onclick="exportAll()">CSV</button>
        <button class="btn btn-primary btn-sm" onclick="openAddEntry()">+ Add</button>
      </div>
    </div>
    <div id="log-list"></div>
  </div>

  <!-- ══ CYCLES TAB ══ -->
  <div class="tab" id="tab-cycles">
    <div class="section-header">
      <span class="section-title">Pay Cycles</span>
      <button class="btn btn-primary btn-sm" onclick="openAddCycle()">+ New</button>
    </div>
    <div id="cycles-list"></div>
  </div>

  <!-- ══ SETTINGS TAB ══ -->
  <div class="tab" id="tab-settings">
    <div class="settings-section">
      <div class="settings-section-title">Pay Settings</div>
      <div class="form-group">
        <label>Hourly Rate ($)</label>
        <input type="number" id="s-rate" step="0.01" min="0" placeholder="0.00" oninput="saveSettings()"/>
      </div>
    </div>
    <div class="settings-section">
      <div class="settings-section-title">Data</div>
      <div class="btn-row">
        <button class="btn btn-secondary w-full" onclick="exportAll()">Export All Entries (CSV)</button>
      </div>
      <div class="btn-row mt-8">
        <button class="btn btn-secondary w-full" onclick="exportActiveCycle()">Export Active Cycle (CSV)</button>
      </div>
      <div class="divider"></div>
      <div class="btn-row">
        <button class="btn btn-danger w-full" onclick="clearAllData()">Clear All Data</button>
      </div>
    </div>
    <div class="settings-section">
      <div class="settings-section-title">About</div>
      <p class="text-subtle">TimeClock v1.0 — Personal time tracker.<br/>Data stored locally on this device.</p>
    </div>
  </div>
</main>

<!-- ══ MODALS ══ -->

<!-- Entry Modal -->
<div class="modal-overlay" id="entry-modal">
  <div class="modal">
    <div class="modal-title" id="entry-modal-title">Add Entry</div>
    <div class="form-group">
      <label>Date</label>
      <input type="date" id="em-date"/>
    </div>
    <div class="form-group">
      <label>Clock In</label>
      <input type="time" id="em-in"/>
    </div>
    <div class="form-group">
      <label>Clock Out</label>
      <input type="time" id="em-out"/>
    </div>
    <div class="form-group">
      <label>Note</label>
      <textarea id="em-note" placeholder="Optional note…"></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal('entry-modal')">Cancel</button>
      <button class="btn btn-primary" onclick="saveEntry()">Save</button>
    </div>
  </div>
</div>

<!-- Cycle Modal -->
<div class="modal-overlay" id="cycle-modal">
  <div class="modal">
    <div class="modal-title">New Pay Cycle</div>
    <div class="form-group">
      <label>Cycle Name</label>
      <input type="text" id="cm-name" placeholder="e.g. Nov 1–15"/>
    </div>
    <div class="form-group">
      <label>Start Date</label>
      <input type="date" id="cm-start"/>
    </div>
    <div class="form-group">
      <label>End Date</label>
      <input type="date" id="cm-end"/>
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal('cycle-modal')">Cancel</button>
      <button class="btn btn-primary" onclick="saveCycle()">Create</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
// ══ STATE ══
let state = {
  entries: [],   // {id, date, inTime, outTime, note}
  cycles:  [],   // {id, name, start, end}
  settings: { rate: 0 },
  activeEntry: null  // {id, inTime, note} while clocked in
};

function load(){
  try{ state.entries  = JSON.parse(localStorage.getItem('tc_entries')  || '[]') }catch(e){}
  try{ state.cycles   = JSON.parse(localStorage.getItem('tc_cycles')   || '[]') }catch(e){}
  try{ state.settings = JSON.parse(localStorage.getItem('tc_settings') || '{"rate":0}') }catch(e){}
  try{ state.activeEntry = JSON.parse(localStorage.getItem('tc_active') || 'null') }catch(e){}
}
function save(key){
  const map = {entries:'tc_entries',cycles:'tc_cycles',settings:'tc_settings',active:'tc_active'};
  if(key==='entries')  localStorage.setItem('tc_entries',  JSON.stringify(state.entries));
  if(key==='cycles')   localStorage.setItem('tc_cycles',   JSON.stringify(state.cycles));
  if(key==='settings') localStorage.setItem('tc_settings', JSON.stringify(state.settings));
  if(key==='active')   localStorage.setItem('tc_active',   JSON.stringify(state.activeEntry));
}
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6) }

// ══ TIME HELPERS ══
function hoursFromEntry(e){
  if(!e.inTime||!e.outTime) return 0;
  const [d,inT] = [e.date, e.inTime], outT = e.outTime;
  const ms = new Date(`${d}T${outT}`) - new Date(`${d}T${inT}`);
  return ms > 0 ? ms/3600000 : 0;
}
function fmtHours(h){ return h.toFixed(2)+' hrs' }
function fmtPay(h){
  const r = parseFloat(state.settings.rate)||0;
  return '$'+(h*r).toFixed(2);
}
function todayStr(){ return new Date().toISOString().slice(0,10) }
function fmtDate(d){
  const [y,m,day] = d.split('-');
  return `${m}/${day}/${y}`;
}
function fmtTime(t){ if(!t) return '—'; const [h,m]=t.split(':'); const hr=+h; return `${hr%12||12}:${m} ${hr>=12?'PM':'AM'}` }
function elapsedStr(inTime){
  const start = new Date(`${todayStr()}T${inTime}`);
  const secs = Math.floor((Date.now()-start)/1000);
  const h=Math.floor(secs/3600), m=Math.floor((secs%3600)/60), s=secs%60;
  return [h,m,s].map(n=>String(n).padStart(2,'0')).join(':');
}

// ══ CLOCK IN/OUT ══
function toggleClock(){
  const noteEl = document.getElementById('punch-note');
  const note = noteEl.value.trim();
  if(!state.activeEntry){
    // Clock in
    const now = new Date();
    const inTime = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
    state.activeEntry = { id: uid(), date: todayStr(), inTime, note };
    save('active');
    noteEl.value = '';
    toast('Clocked in at '+fmtTime(inTime),'success');
  } else {
    // Clock out
    const now = new Date();
    const outTime = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
    const outNote = note || state.activeEntry.note;
    const entry = { ...state.activeEntry, outTime, note: outNote };
    const hrs = hoursFromEntry(entry);
    if(hrs <= 0){ toast('Clock out must be after clock in','error'); return; }
    state.entries.unshift(entry);
    state.activeEntry = null;
    save('entries'); save('active');
    noteEl.value = '';
    toast(`Clocked out — ${fmtHours(hrs)}`,'success');
  }
  refreshAll();
}

// ══ TIMER ══
let timerInterval = null;
function startTimer(){
  if(timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(()=>{
    if(!state.activeEntry){ clearInterval(timerInterval); return; }
    document.getElementById('timer').textContent = elapsedStr(state.activeEntry.inTime);
  }, 1000);
}

// ══ CLOCK TAB REFRESH ══
function refreshClock(){
  const btn = document.getElementById('clock-btn');
  const timer = document.getElementById('timer');
  const badge = document.getElementById('status-badge');

  if(state.activeEntry){
    btn.textContent = 'CLOCK OUT';
    btn.className = 'clocked-out'; // re-use style with red
    btn.style.background='var(--danger)'; btn.style.color='#fff';
    timer.classList.remove('hidden');
    timer.textContent = elapsedStr(state.activeEntry.inTime);
    badge.textContent='Clocked In'; badge.className='badge badge-green';
    startTimer();
  } else {
    btn.textContent='CLOCK IN'; btn.style.background=''; btn.style.color='';
    btn.className='clocked-out';
    timer.classList.add('hidden');
    if(timerInterval){ clearInterval(timerInterval); timerInterval=null; }
    badge.textContent='Clocked Out'; badge.className='badge badge-subtle';
  }

  // Today total
  const todayEntries = state.entries.filter(e=>e.date===todayStr());
  const todayHrs = todayEntries.reduce((a,e)=>a+hoursFromEntry(e),0);
  document.getElementById('today-hours').textContent = fmtHours(todayHrs);
  document.getElementById('today-pay').textContent   = fmtPay(todayHrs);

  // Active cycle
  const active = getActiveCycle();
  if(active){
    document.getElementById('active-cycle-name').textContent = active.name;
    const cycHrs = entriesForCycle(active).reduce((a,e)=>a+hoursFromEntry(e),0);
    document.getElementById('cycle-hours').textContent = fmtHours(cycHrs);
    document.getElementById('cycle-pay').textContent   = fmtPay(cycHrs);
  } else {
    document.getElementById('active-cycle-name').textContent='None';
    document.getElementById('cycle-hours').textContent='—';
    document.getElementById('cycle-pay').textContent='—';
  }
}

function getActiveCycle(){
  const today = todayStr();
  return state.cycles.find(c=>c.start<=today&&c.end>=today)||null;
}
function entriesForCycle(c){
  return state.entries.filter(e=>e.date>=c.start&&e.date<=c.end);
}

// ══ LOG TAB ══
let editingEntryId = null;
function refreshLog(){
  const list = document.getElementById('log-list');
  if(!state.entries.length){
    list.innerHTML='<div class="empty"><div class="empty-icon">📋</div><p>No entries yet.<br/>Clock in to start tracking.</p></div>';
    return;
  }
  list.innerHTML = state.entries.map(e=>{
    const hrs = hoursFromEntry(e);
    const pay = (hrs*(parseFloat(state.settings.rate)||0)).toFixed(2);
    return `<div class="entry-card">
      <div class="entry-header">
        <div class="entry-date">${fmtDate(e.date)}</div>
        <div class="entry-actions">
          <button class="btn btn-secondary btn-sm" onclick="openEditEntry('${e.id}')">Edit</button>
          <button class="btn btn-danger btn-sm" onclick="deleteEntry('${e.id}')">✕</button>
        </div>
      </div>
      <div class="entry-times">${fmtTime(e.inTime)} → ${fmtTime(e.outTime)}</div>
      <div class="entry-meta">
        <span class="badge badge-yellow">${fmtHours(hrs)}</span>
        <span class="badge badge-green">$${pay}</span>
      </div>
      ${e.note?`<div class="entry-note">${escHtml(e.note)}</div>`:''}
    </div>`;
  }).join('');
}

function openAddEntry(){
  editingEntryId = null;
  document.getElementById('entry-modal-title').textContent='Add Entry';
  document.getElementById('em-date').value=todayStr();
  document.getElementById('em-in').value='';
  document.getElementById('em-out').value='';
  document.getElementById('em-note').value='';
  openModal('entry-modal');
}
function openEditEntry(id){
  const e = state.entries.find(x=>x.id===id); if(!e) return;
  editingEntryId = id;
  document.getElementById('entry-modal-title').textContent='Edit Entry';
  document.getElementById('em-date').value=e.date;
  document.getElementById('em-in').value=e.inTime||'';
  document.getElementById('em-out').value=e.outTime||'';
  document.getElementById('em-note').value=e.note||'';
  openModal('entry-modal');
}
function saveEntry(){
  const date=document.getElementById('em-date').value;
  const inTime=document.getElementById('em-in').value;
  const outTime=document.getElementById('em-out').value;
  const note=document.getElementById('em-note').value.trim();
  if(!date||!inTime||!outTime){toast('Fill in date, in, and out times','error');return;}
  if(outTime<=inTime){toast('Out time must be after in time','error');return;}
  if(editingEntryId){
    const idx=state.entries.findIndex(x=>x.id===editingEntryId);
    if(idx>-1) state.entries[idx]={...state.entries[idx],date,inTime,outTime,note};
  } else {
    state.entries.unshift({id:uid(),date,inTime,outTime,note});
  }
  state.entries.sort((a,b)=>b.date.localeCompare(a.date)||(b.inTime||'').localeCompare(a.inTime||''));
  save('entries');
  closeModal('entry-modal');
  toast('Entry saved','success');
  refreshAll();
}
function deleteEntry(id){
  if(!confirm('Delete this entry?')) return;
  state.entries=state.entries.filter(x=>x.id!==id);
  save('entries');
  refreshAll();
  toast('Entry deleted');
}

// ══ CYCLES TAB ══
function refreshCycles(){
  const list = document.getElementById('cycles-list');
  const today = todayStr();
  if(!state.cycles.length){
    list.innerHTML='<div class="empty"><div class="empty-icon">📅</div><p>No pay cycles yet.<br/>Tap + New to create one.</p></div>';
    return;
  }
  list.innerHTML = state.cycles.map((c,i)=>{
    const entries = entriesForCycle(c);
    const hrs = entries.reduce((a,e)=>a+hoursFromEntry(e),0);
    const pay = (hrs*(parseFloat(state.settings.rate)||0)).toFixed(2);
    const isActive = c.start<=today&&c.end>=today;
    return `<div class="cycle-card">
      <div class="cycle-header" onclick="toggleCycle('cycle-body-${i}')">
        <div>
          <div class="cycle-name">${escHtml(c.name)} ${isActive?'<span class="badge badge-green">Active</span>':''}</div>
          <div class="cycle-range">${fmtDate(c.start)} – ${fmtDate(c.end)}</div>
        </div>
        <div class="cycle-stats">
          <div class="badge badge-yellow">${fmtHours(hrs)}</div>
          <div class="badge badge-green mt-8">$${pay}</div>
        </div>
      </div>
      <div class="cycle-body" id="cycle-body-${i}">
        <div class="cycle-total-row">
          <span class="text-subtle">${entries.length} entries</span>
          <div class="btn-row">
            <button class="btn btn-secondary btn-sm" onclick="exportCycle('${c.id}')">CSV</button>
            <button class="btn btn-danger btn-sm" onclick="deleteCycle('${c.id}')">Delete</button>
          </div>
        </div>
        ${entries.length?entries.map(e=>`
          <div class="entry-card" style="margin-bottom:6px">
            <div class="entry-header">
              <div class="entry-date">${fmtDate(e.date)}</div>
            </div>
            <div class="entry-times">${fmtTime(e.inTime)} → ${fmtTime(e.outTime)}</div>
            <div class="entry-meta">
              <span class="badge badge-yellow">${fmtHours(hoursFromEntry(e))}</span>
              <span class="badge badge-green">$${(hoursFromEntry(e)*(parseFloat(state.settings.rate)||0)).toFixed(2)}</span>
            </div>
            ${e.note?`<div class="entry-note">${escHtml(e.note)}</div>`:''}
          </div>`).join('')
          :'<p class="text-subtle" style="padding:8px 0">No entries in this cycle yet.</p>'}
      </div>
    </div>`;
  }).join('');
}
function toggleCycle(id){
  const el=document.getElementById(id); if(!el) return;
  el.classList.toggle('open');
}
function openAddCycle(){
  document.getElementById('cm-name').value='';
  document.getElementById('cm-start').value=todayStr();
  document.getElementById('cm-end').value='';
  openModal('cycle-modal');
}
function saveCycle(){
  const name=document.getElementById('cm-name').value.trim();
  const start=document.getElementById('cm-start').value;
  const end=document.getElementById('cm-end').value;
  if(!name||!start||!end){toast('Fill in all cycle fields','error');return;}
  if(end<start){toast('End must be after start','error');return;}
  state.cycles.unshift({id:uid(),name,start,end});
  save('cycles');
  closeModal('cycle-modal');
  toast('Cycle created','success');
  refreshAll();
}
function deleteCycle(id){
  if(!confirm('Delete this cycle?')) return;
  state.cycles=state.cycles.filter(x=>x.id!==id);
  save('cycles');
  refreshAll();
  toast('Cycle deleted');
}

// ══ SETTINGS ══
function loadSettings(){
  document.getElementById('s-rate').value=state.settings.rate||'';
}
function saveSettings(){
  state.settings.rate=parseFloat(document.getElementById('s-rate').value)||0;
  save('settings');
  refreshAll();
}

// ══ CSV EXPORT ══
function buildCSV(entries, label){
  const rate = parseFloat(state.settings.rate)||0;
  let rows = [['Date','Clock In','Clock Out','Hours','Earnings','Note']];
  let totalHrs=0;
  entries.forEach(e=>{
    const h=hoursFromEntry(e); totalHrs+=h;
    rows.push([e.date, fmtTime(e.inTime), fmtTime(e.outTime), h.toFixed(2), '$'+(h*rate).toFixed(2), e.note||'']);
  });
  rows.push(['TOTAL','','',totalHrs.toFixed(2),'$'+(totalHrs*rate).toFixed(2),'']);
  const csv = rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob([csv],{type:'text/csv'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download=`timeclock-${label}-${todayStr()}.csv`; a.click();
  toast('CSV downloaded','success');
}
function exportAll(){ buildCSV(state.entries,'all') }
function exportActiveCycle(){
  const c=getActiveCycle();
  if(!c){toast('No active cycle','error');return;}
  buildCSV(entriesForCycle(c),c.name.replace(/\s+/g,'-'));
}
function exportCycle(id){
  const c=state.cycles.find(x=>x.id===id); if(!c) return;
  buildCSV(entriesForCycle(c),c.name.replace(/\s+/g,'-'));
}

// ══ UTILITIES ══
function escHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') }
function openModal(id){ document.getElementById(id).classList.add('open') }
function closeModal(id){ document.getElementById(id).classList.remove('open') }
// close modal on overlay tap
document.querySelectorAll('.modal-overlay').forEach(o=>{
  o.addEventListener('click',e=>{ if(e.target===o) o.classList.remove('open') });
});

let toastTimer=null;
function toast(msg,type=''){
  const el=document.getElementById('toast');
  el.textContent=msg; el.className='show'+(type?' '+type:'');
  if(toastTimer) clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>{ el.className='' },2500);
}

function clearAllData(){
  if(!confirm('Clear ALL data? This cannot be undone.')) return;
  state={entries:[],cycles:[],settings:{rate:0},activeEntry:null};
  ['tc_entries','tc_cycles','tc_settings','tc_active'].forEach(k=>localStorage.removeItem(k));
  refreshAll(); toast('All data cleared');
}

// ══ TABS ══
function switchTab(name){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));
  document.getElementById('tab-'+name).classList.add('active');
  document.querySelector(`nav button[onclick="switchTab('${name}')"]`).classList.add('active');
  if(name==='log') refreshLog();
  if(name==='cycles') refreshCycles();
}

function refreshAll(){
  refreshClock();
  if(document.getElementById('tab-log').classList.contains('active'))    refreshLog();
  if(document.getElementById('tab-cycles').classList.contains('active')) refreshCycles();
}

// ══ LIVE CLOCK ══
function updateHeaderClock(){
  const now=new Date();
  document.getElementById('clock-display').textContent=
    now.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
}

// ══ SERVICE WORKER ══
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{ navigator.serviceWorker.register('sw.js') });
}

// ══ INIT ══
load();
loadSettings();
refreshAll();
updateHeaderClock();
setInterval(updateHeaderClock,1000);
</script>
